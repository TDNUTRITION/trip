<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>A private trip</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121417);--ink:light-dark(#1d2024,#e8e9eb);--muted:light-dark(#6b7078,#9ba0a8);--line:light-dark(#d9dbde,#34373c)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px max(5vw,16px)}
form{width:min(100%,360px)}h1{font:500 32px/1.1 Georgia,serif;margin:0 0 6px}p{color:var(--muted);margin:0 0 22px}
input[type=password]{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
label.r{display:flex;gap:8px;align-items:center;margin:14px 0 18px;color:var(--muted);font-size:15px}
button{width:100%;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
#err{color:#b24a4a;min-height:1.5em;margin-top:10px;font-size:15px}
</style></head><body>
<form id="f"><h1>A private trip</h1><p>Enter the password to open it.</p>
<input type="password" id="pw" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Password" required>
<label class="r"><input type="checkbox" id="rem" checked> Remember on this device</label>
<button id="go">Open</button><div id="err" role="alert"></div></form>
<script>
(async()=>{
const SALT='6v1SoRrrvWwND18xZw0itg==',ITER=600000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),tob64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const b=new Uint8Array(await (await fetch('site.bin',{cache:'no-cache'})).arrayBuffer());const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));const html=new TextDecoder().decode(p);document.open();document.write(html);document.close()}
let saved=null;try{saved=sessionStorage.getItem('tk')||localStorage.getItem('tk')}catch(e){}
if(saved){try{await open(b64(saved));return}catch(e){try{localStorage.removeItem('tk');sessionStorage.removeItem('tk')}catch(_){}}}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');btn.textContent='Opening…';err.textContent='';
try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim().toLowerCase()),'PBKDF2',false,['deriveBits']);
const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,256);
const s=tob64(raw);try{sessionStorage.setItem('tk',s);if(document.getElementById('rem').checked)localStorage.setItem('tk',s)}catch(_){}
await open(raw)}catch(x){try{sessionStorage.removeItem('tk');localStorage.removeItem('tk')}catch(_){}btn.textContent='Open';err.textContent='That password did not work.'}});
})();
</script></body></html>
